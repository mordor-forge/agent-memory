name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: 'Breaking Changes'
    labels:
      - 'breaking'
  - title: 'Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: 'Bug Fixes'
    labels:
      - 'bug'
      - 'fix'
  - title: 'Documentation'
    labels:
      - 'docs'
  - title: 'Maintenance'
    labels:
      - 'chore'
      - 'test'
      - 'ci'

change-template: '- $TITLE (#$NUMBER)'
change-title-escapes: '\<*_&'

template: |
  ## Highlights

  $CHANGES

  ## Operational Notes

  - CockroachDB remains the only supported backend.
  - MCP is local-first unless otherwise stated in the release notes.

  ## Known Limitations

  - API compatibility is still evolving during the `v0.1.x` alpha series.
